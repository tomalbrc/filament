plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'maven-publish'
    id 'net.darkhax.curseforgegradle' version '1.3.32'
}

import net.fabricmc.loom.build.nesting.JarNester
import org.slf4j.LoggerFactory

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/filament.accesswidener")
}

configurations {
    shade
    implementation.extendsFrom(shade)

    includeResolvable {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        extendsFrom configurations.include
    }
}

repositories {
    maven { url 'https://maven.tomalbrc.de' }
    maven { url 'https://maven.nucleoid.xyz' }
    maven { url 'https://maven.blamejared.com' }
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation("net.fabricmc:fabric-loader:${project.loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    implementation("eu.pb4:polymer-core:${project.polymer_version}")
    implementation("eu.pb4:polymer-blocks:${project.polymer_version}")
    implementation("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    implementation("eu.pb4:polymer-resource-pack-extras:${project.polymer_version}")
    implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
    implementation("eu.pb4:polymer-networking:${project.polymer_version}")
    implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
    implementation("eu.pb4:polymer-sound-patcher:${project.polymer_version}")

    implementation include("eu.pb4:sgui:${project.sgui_version}")
    implementation include('me.lucko:fabric-permissions-api:0.7.0')

    implementation include("de.tomalbrc:blockbench-import-library:${project.bil_version}")

    // Text format
    implementation include("eu.pb4:placeholder-api:${project.papi_version}")

    shade('org.yaml:snakeyaml:2.6')
    shade("org.eclipse.jetty:jetty-server:12.1.10")
    shade("org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-server:12.1.10")
    shade("com.github.victools:jsonschema-generator:5.0.0")
    shade("com.j2html:j2html:1.6.0")
    shade("org.json:json:20251224")
    shade("tools.jackson.core:jackson-core:3.1.0")
    shade("tools.jackson.core:jackson-databind:3.1.0")

    // claim compat
    implementation include("eu.pb4:common-protection-api:2.0.0")
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'thin'
}

shadowJar {
    dependsOn tasks.named('jar')

    from(zipTree(tasks.named('jar').flatMap { it.archiveFile }))
    configurations = [project.configurations.shade]
    archiveClassifier = ''          // use the default artifact name

    def relocations = [
            "com.j2html" : "j2html",
            "org.json"   : "orgjson"
    ]
    relocations.each { prop, target ->
        relocate prop, "de.tomalbrc.filament.libs.${target}"
    }

    dependencies {
        exclude(dependency('org.ow2.asm:.*'))
        exclude(dependency('com.google.guava:guava:.*'))
        exclude(dependency('com.google.code.gson:gson:.*'))
        exclude(dependency('org.apache.commons:commons-lang3:.*'))
    }

    doLast {
        JarNester.nestJars(
                project.configurations.includeResolvable.files,
                shadowJar.archiveFile.get().asFile,
                LoggerFactory.getLogger("filament-JiJ")
        )
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "bil_version": project.bil_version,
                "polymer_version": project.polymer_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release.set(25)
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv('CURSEFORGE_API_KEY')
    def projectId = findProperty('curseforge_project_id')
    def mainFile = upload(projectId, tasks.shadowJar)

    mainFile.displayName = "${project.archives_base_name}-${project.version}"
    mainFile.changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : 'No changelog provided.'
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'

    mainFile.addEnvironment('Server')

    mainFile.addRequirement('fabric-api')
    mainFile.addRequirement('polymer')
}